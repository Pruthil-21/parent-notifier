[project]
name = "parent-notifier"
version = "0.0.0"
description = "Mentor dashboard that imports semester attendance and mid-sem marks from Excel, flags students at risk, and sends each parent a personalised WhatsApp update."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use plain assert; the layout checks call git by name on purpose.
"tests/**" = ["S101"]
"scripts/checks/**" = ["S603", "S607"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
