[project]
name = "parent-notifier"
version = "0.1.0"
description = "Mentor dashboard that imports semester attendance and mid-sem marks from Excel, flags students at risk, and sends each parent a personalised WhatsApp update."
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7",
    "flask>=3.1",
    "flask-limiter>=3.8",
    "flask-login>=0.6",
    "flask-migrate>=4.0",
    "flask-sqlalchemy>=3.1",
    "flask-wtf>=1.2",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "tzdata>=2025.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-playwright>=0.9.0",
    "pytest-xdist>=3.6",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use plain assert and placeholder secrets.
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Browser smoke tests are left out of the default run: `pytest -m e2e` runs them.
addopts = [
    "-ra", "--strict-markers", "--strict-config", "--import-mode=importlib", "-n", "auto",
    "-m", "not e2e",
]
markers = ["e2e: browser smoke tests against a live server (needs a Playwright browser)"]
filterwarnings = [
    # Flask-Login 0.6.3 calls datetime.utcnow() when it sets the remember-me cookie.
    "ignore:datetime.datetime.utcnow:DeprecationWarning:flask_login",
]
