<header class="top-bar">
  <button type="button" class="top-bar__button" data-nav-toggle
          aria-controls="nav-pane" aria-expanded="false" aria-label="Hide navigation">
    {{ icon("menu") }}
  </button>
  <a class="top-bar__brand" href="{{ home_url }}">
    <span class="top-bar__product">Parent Notifier</span>
    <span class="top-bar__org">{{ config.COLLEGE_SHORT_NAME }}</span>
  </a>
  {% if current_user.is_authenticated %}
  <div class="top-bar__end">
    <p class="top-bar__sending-as">
      Sending as <span class="numeric">{{ current_user.whatsapp_number | phone }}</span>
    </p>
    {% include "components/navigation/theme_menu.html" %}
    {% include "components/navigation/account_menu.html" %}
  </div>
  {% endif %}
</header>
