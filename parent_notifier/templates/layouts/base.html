<!doctype html>
<html lang="en" data-theme="{{ current_user.theme if current_user.is_authenticated else 'system' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}{% if self.title() %} · {% endif %}Parent Notifier</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  {# For fetch calls, which send it back in the X-CSRFToken header. #}
  <meta name="csrf-token" content="{{ csrf_token() }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Skip to main content</a>
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
